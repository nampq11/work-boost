<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Daily Standup</title>
</head>
<body>
  <div class="wb-app" x-data="standupViewer()" x-init="init()">
    <main class="wb-container">
      <header class="wb-topbar">
        <div class="wb-heading-group">
          <div class="wb-kicker">
            <span class="wb-kicker-mark">Daily note</span>
          </div>
          <h1 class="wb-title">Báo Cáo <span class="wb-title-accent">Standup</span></h1>
          <p class="wb-subtitle">Một trang ngắn để nhìn lại hôm qua và giữ nhịp cho hôm nay.</p>
          <span class="wb-standup-date" x-text="'Ngày ' + currentDate"></span>
        </div>
        <div class="wb-actions">
          <button class="wb-button wb-button-primary" type="button" @click="copyMarkdown()" :disabled="!doc">
            <span aria-hidden="true">↗</span>
            <span>Copy Markdown</span>
          </button>
        </div>
      </header>

      <template x-if="error">
        <div class="wb-alert" role="alert" x-text="error"></div>
      </template>

      <template x-if="!error && !doc">
        <div class="wb-empty wb-empty-standup">
          <span class="wb-empty-mark" aria-hidden="true">∅</span>
          Chưa có báo cáo cho hôm nay.
          <div class="wb-section-note wb-empty-note">Khi Markdown được cập nhật, nội dung sẽ xuất hiện ở đây.</div>
        </div>
      </template>

      <section class="wb-report-grid" x-show="doc && !error" x-cloak aria-label="Nội dung standup">
        <article class="wb-report-card wb-report-card-success">
          <h2 class="wb-report-heading">
            <span class="wb-report-index">01</span>
            Việc đã hoàn thành hôm trước
          </h2>
          <ul class="wb-report-list">
            <template x-for="item in doc?.report?.completed || []">
              <li class="wb-report-item">
                <span class="wb-project" x-text="item.project"></span>
                <span class="wb-task" x-text="item.task"></span>
              </li>
            </template>
          </ul>
        </article>

        <article class="wb-report-card wb-report-card-danger">
          <h2 class="wb-report-heading">
            <span class="wb-report-index">02</span>
            Chưa hoàn thành
          </h2>
          <ul class="wb-report-list">
            <template x-for="item in doc?.report?.incomplete || []">
              <li class="wb-report-item">
                <span class="wb-project" x-text="item.project"></span>
                <span class="wb-task" x-text="item.task"></span>
              </li>
            </template>
          </ul>
        </article>

        <article class="wb-report-card wb-report-card-primary">
          <h2 class="wb-report-heading">
            <span class="wb-report-index">03</span>
            Kế hoạch hôm nay
          </h2>
          <ul class="wb-report-list">
            <template x-for="item in doc?.report?.planned || []">
              <li class="wb-report-item">
                <span class="wb-project" x-text="item.project"></span>
                <span class="wb-task" x-text="item.task"></span>
              </li>
            </template>
          </ul>
        </article>
      </section>
    </main>
  </div>

  <script>
    function standupViewer() {
      return {
        currentDate: '',
        doc: null,
        error: '',
        async init() {
          window.addEventListener('workboost:change', () => this.load());
          await this.load();
        },
        async load() {
          this.error = '';
          try {
            this.currentDate = await window.workboost.time.getCurrentDate();
            this.doc = await window.workboost.daily.getToday();
          } catch (error) {
            this.error = 'Không tải được báo cáo: ' + (error.message || error);
          }
        },
        async copyMarkdown() {
          if (!this.doc?.rawMarkdown) return;
          await navigator.clipboard.writeText(this.doc.rawMarkdown);
        }
      }
    }
  </script>
</body>
</html>
