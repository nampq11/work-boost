<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sổ Nợ Work Boost</title>
</head>
<body>
  <div class="wb-app" x-data="debtTracker()" x-init="init()">
    <main class="wb-container wb-container-wide">
      <header class="wb-topbar">
        <div class="wb-heading-group">
          <div class="wb-kicker">
            <span class="wb-kicker-mark">Debt ledger</span>
            <span class="wb-live">Live sync</span>
          </div>
          <h1 class="wb-title">Sổ Nợ <span class="wb-title-accent">Work Boost</span></h1>
          <p class="wb-subtitle">Theo dõi các khoản cho vay và đi vay từ một sổ Markdown duy nhất.</p>
        </div>
        <div class="wb-actions">
          <button class="wb-button wb-button-quiet" type="button" @click="loadData()" title="Tải lại dữ liệu">
            <span aria-hidden="true">↻</span>
            <span>Làm mới</span>
          </button>
        </div>
      </header>

      <template x-if="error">
        <div class="wb-alert" role="alert" x-text="error"></div>
      </template>

      <section class="wb-section" aria-labelledby="position-heading">
        <div class="wb-section-head">
          <span id="position-heading" class="wb-section-label">Position</span>
          <span class="wb-section-note">Tổng hợp theo loại tiền</span>
        </div>
        <div class="wb-summary-grid">
          <template x-for="(totals, curr) in summary.currencies" :key="curr">
            <article class="wb-summary-card">
              <div class="wb-summary-top">
                <span class="wb-currency" x-text="curr"></span>
                <span class="wb-balance-state"
                      :class="(totals.lent - totals.borrowed) >= 0 ? 'wb-balance-positive' : 'wb-balance-negative'"
                      x-text="(totals.lent - totals.borrowed) >= 0 ? 'Dương' : 'Âm'"></span>
              </div>
              <div class="wb-amount" x-text="formatMoney(totals.lent - totals.borrowed, curr)"></div>
              <div class="wb-breakdown">
                <span>Được nợ <strong class="wb-positive" x-text="formatMoney(totals.lent, curr)"></strong></span>
                <span>Cần trả <strong class="wb-negative" x-text="formatMoney(totals.borrowed, curr)"></strong></span>
              </div>
            </article>
          </template>
        </div>
      </section>

      <section class="wb-section" aria-labelledby="ledger-heading">
        <div class="wb-section-head">
          <span id="ledger-heading" class="wb-section-label">Ledger</span>
          <span class="wb-section-note">Các khoản đang theo dõi</span>
        </div>
        <div class="wb-filterbar" role="group" aria-label="Lọc khoản nợ">
          <template x-for="f in ['all', 'pending', 'paid', 'lent', 'borrowed']" :key="f">
            <button type="button"
                    class="wb-filter"
                    :class="filter === f ? 'is-active' : ''"
                    :aria-pressed="filter === f"
                    @click="filter = f; loadDebts()"
                    x-text="f"></button>
          </template>
        </div>

        <div class="wb-list">
          <template x-if="debts.length === 0">
            <div class="wb-empty">
              <span class="wb-empty-mark" aria-hidden="true">∅</span>
              Chưa có khoản nợ phù hợp với bộ lọc này.
            </div>
          </template>
          <template x-for="debt in debts" :key="debt.frontmatter.id">
            <article class="wb-list-row">
              <div class="wb-row-main">
                <div class="wb-row-label">
                  <span class="wb-direction"
                        :class="debt.frontmatter.direction === 'lent' ? 'wb-direction-lent' : 'wb-direction-borrowed'"
                        x-text="debt.frontmatter.direction === 'lent' ? 'Cho vay' : 'Đi vay'"></span>
                  <span class="wb-person" x-text="debt.frontmatter.personName"></span>
                  <span class="wb-date" x-text="debt.frontmatter.debtDate"></span>
                </div>
                <p class="wb-reason" x-text="debt.reason || 'Không có ghi chú cho khoản này.'"></p>
              </div>
              <div class="wb-row-side">
                <div>
                  <div class="wb-row-amount" x-text="formatMoney(debt.frontmatter.amount, debt.frontmatter.currency)"></div>
                  <span class="wb-status"
                        :class="debt.frontmatter.status === 'paid' ? 'wb-status-paid' : 'wb-status-pending'"
                        x-text="debt.frontmatter.status === 'paid' ? 'Đã trả' : 'Chờ trả'"></span>
                </div>
                <template x-if="debt.frontmatter.status === 'pending'">
                  <button type="button" class="wb-button wb-button-quiet" @click="settle(debt.frontmatter.id)">
                    Xác nhận trả
                  </button>
                </template>
              </div>
            </article>
          </template>
        </div>
      </section>
    </main>
  </div>

  <script>
    function debtTracker() {
      return {
        filter: 'all',
        debts: [],
        summary: { currencies: {} },
        error: '',
        async init() {
          await this.loadData();
          window.addEventListener('workboost:change', () => this.loadData());
        },
        async loadData() {
          this.error = '';
          try {
            await Promise.all([this.loadSummary(), this.loadDebts()]);
          } catch (err) {
            this.error = 'Không tải được dữ liệu: ' + (err.message || err);
          }
        },
        async loadSummary() {
          this.summary = await window.workboost.debts.getSummary();
        },
        async loadDebts() {
          const query = {};
          if (this.filter === 'pending' || this.filter === 'paid') query.status = this.filter;
          if (this.filter === 'lent' || this.filter === 'borrowed') query.direction = this.filter;
          this.debts = await window.workboost.debts.list(query);
        },
        async settle(id) {
          await window.workboost.debts.settle(id);
          await this.loadData();
        },
        formatMoney(amount, currency = 'VND') {
          try {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency }).format(amount || 0);
          } catch {
            return `${amount || 0} ${currency}`;
          }
        }
      }
    }
  </script>
</body>
</html>
