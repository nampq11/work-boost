name: Deploy

on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate deployment entrypoint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Check deployment entrypoint
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check apps/api/src/main.ts
