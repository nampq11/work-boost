name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop-bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "--bundles dmg"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # AppImage is deliberately skipped: bundling takes ~15 minutes
            # (squashfs-compressing the large sidecar) and we only ship .deb
            bundles: "--bundles deb"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "--bundles msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # cache Deno's module cache keyed on deno.lock; skips re-downloading deps each run
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      # warm cache skips compiling the full Tauri dependency tree on repeat runs;
      # first (cache-miss) run pays the same cold-build cost as before
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux webview system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libappindicator3-dev

      - name: Build desktop bundle
        working-directory: apps/desktop
        shell: bash
        # install locally so npx uses node_modules instead of fetching the CLI ad hoc
        run: |
          npm install --no-fund --no-audit
          npm run build:api -- --force
          npx @tauri-apps/cli build ${{ matrix.bundles }}

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle \
            \( -name '*.deb' -o -name '*.dmg' -o -name '*.msi' \) \
            -exec cp {} dist/ \;
          cd dist
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -la

      - name: Upload bundles to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
