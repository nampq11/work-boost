name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.4.0)"
        required: true

permissions:
  contents: write

# Only one release build per ref/version at a time; a newer trigger cancels a stale one.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  desktop-bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "--bundles dmg"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # AppImage is deliberately skipped: bundling takes ~15 minutes
            # (squashfs-compressing the large sidecar) and we only ship .deb
            bundles: "--bundles deb"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "--bundles msi"
    runs-on: ${{ matrix.os }}
    env:
      # sccache caches compiled objects across runs; the GitHub Actions cache is the backend.
      # This is the biggest win on Windows (MSVC + the large Tauri tree), and helps all platforms
      # on a rust-cache miss. rust-cache still caches the target/ dir for unchanged crates.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # cache Deno's module cache keyed on deno.lock; skips re-downloading deps each run
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      # warm cache skips compiling the full Tauri dependency tree on repeat runs;
      # first (cache-miss) run pays the same cold-build cost as before
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      # sccache uses the GH actions cache as its backend and exposes the RUSTC_WRAPPER binary
      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache the npm download cache keyed on the desktop lockfile; makes `npm ci` fast
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux webview system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libappindicator3-dev

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --no-fund --no-audit

      - name: Set desktop version and release tag
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            RELEASE_TAG="v${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.version = version;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            }
            // Cargo.toml is TOML, not JSON. Bump only the top-level [package] version line so the
            // crate version matches the tag too; dependency versions are indented and never match.
            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8").replace(
              /^version = ".*"$/m,
              `version = "${version}"`,
            );
            fs.writeFileSync(cargoPath, cargo);
          ' "$VERSION"
          echo "desktop version set to $VERSION"
      - name: Build desktop bundle
        working-directory: apps/desktop
        shell: bash
        run: |
          npm run build:api -- --force
          npx @tauri-apps/cli build ${{ matrix.bundles }}

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle \
            \( -name '*.deb' -o -name '*.dmg' -o -name '*.msi' \) \
            -exec cp {} dist/ \;
          cd dist
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -la

      - name: Upload bundles to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
