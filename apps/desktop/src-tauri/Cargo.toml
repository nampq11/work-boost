[package]
name = "workboost-desktop"
version = "0.1.0"
description = "Work Boost desktop shell (Tauri 2)"
authors = ["Work Boost"]
edition = "2021"

[lib]
name = "workboost_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
notify = "6"

[features]
# Must be enabled explicitly with `--features custom-protocol`; the Tauri CLI no longer turns it on
# automatically. The build entrypoints (`apps/desktop/package.json` and `.github/workflows/release.yml`)
# pass it, while `tauri dev` omits it. Drives whether the shell spawns the API sidecar (release) or
# points at a separately started `deno task dev` API (dev).
custom-protocol = ["tauri/custom-protocol"]

# Keep the Rust surface tiny; the API sidecar holds all business logic.
# lto = "thin" gives most of fat LTO's binary-size benefit at a fraction of the compile cost,
# which matters on CI (Windows release compile was the critical path). codegen-units stays at
# the default so the final crate codegens in parallel instead of serially.
[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
