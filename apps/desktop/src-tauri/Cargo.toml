[package]
name = "workboost-desktop"
version = "0.1.0"
description = "Work Boost desktop shell (Tauri 2)"
authors = ["Work Boost"]
edition = "2021"

[lib]
name = "workboost_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by the Tauri CLI for `tauri build` (production, bundled frontend) and disabled for
# `tauri dev`. Drives whether the shell spawns the API sidecar (release) or points at a separately
# started `deno task dev` API (dev).
custom-protocol = ["tauri/custom-protocol"]

# Keep the Rust surface tiny; the API sidecar holds all business logic.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
